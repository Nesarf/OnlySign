[project]
name = "onlysign"
# Kept in step with the identity file, which is where the executable and the installer both read
# their version from. It had drifted to 0.1.0 while the binaries said 1.0.0; `tools/build.py` now
# refuses to build when the two disagree rather than letting a second number go wrong quietly.
version = "1.0.2"
description = "Sign local build artifacts, and be able to say later what was signed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# Empty on purpose, and it should stay that way: the tool is meant to run on a machine that has
# nothing installed. tkinter, hashlib, json and ctypes all ship with Python, and the signing itself
# goes through the Windows PowerShell that ships with Windows.
dependencies = []

[project.scripts]
onlysign-selftest = "onlysign.selftest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["onlysign", "onlysign.engine"]
